<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Nie ma takiej strony — ZOVU</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Oswald:wght@600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    /* Страница ошибки светлая, как и сайт: тёмная заглушка после светлых
       страниц читается как «попал не туда совсем». */
    :root { --akcent: #6d28d9; --tekst: #16141b; --cichy: #6c6878; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh; display: flex; align-items: center; justify-content: center;
      padding: 32px 22px; background: #fff; color: var(--tekst);
      font-family: 'Manrope', system-ui, sans-serif;
      background-image: radial-gradient(120% 420px at 50% 0%, rgba(124,58,237,.14) 0%, rgba(124,58,237,0) 100%);
    }
    .box { max-width: 560px; text-align: center; }
    .logo { width: 78px; height: 78px; margin: 0 auto 26px; display: block; }
    .kod {
      font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .24em;
      text-transform: uppercase; color: var(--akcent); margin-bottom: 14px;
    }
    h1 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 700;
      text-transform: uppercase; font-size: clamp(34px, 9vw, 56px); line-height: .98;
      margin-bottom: 16px;
    }
    p { font-size: 17px; line-height: 1.6; color: var(--cichy); margin-bottom: 30px; }
    .btny { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a.btn {
      display: inline-flex; align-items: center; padding: 14px 26px; border-radius: 40px;
      text-decoration: none; font-weight: 700; font-size: 15px;
      transition: transform .18s ease;
    }
    a.btn:hover { transform: translateY(-2px); }
    a.btn.glowny { background: var(--tekst); color: #fff; }
    a.btn.wa { background: #25D366; color: #05230f; }
    @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="/logo_icon.png" alt="ZOVU" width="78" height="78">
    <div class="kod">Błąd 404</div>
    <h1>Tej strony nie ma</h1>
    <p>Adres jest zły albo strona się przeprowadziła. Wróć na stronę główną — prace i kontakt są na miejscu.</p>
    <div class="btny">
      <a class="btn glowny" href="/">Strona główna</a>
      <a class="btn wa" href="https://wa.me/48571795097" target="_blank" rel="noopener">Napisz na WhatsApp</a>
    </div>
  </div>
</body>
</html>
